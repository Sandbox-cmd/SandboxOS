<!-- @dsCard group="Components" viewport="700x200" name="Knob + Switch" subtitle="The cassette-deck dial + the hard power rocker" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); padding:24px 26px; font-family:var(--font-mono); }
  .lbl { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:0 0 14px; }
  .row { display:flex; gap:26px; flex-wrap:wrap; align-items:center; margin-bottom:22px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Knob, Switch } = window.SandboxOSDesignSystem_4526c4;
  function Demo(){
    const [snd,setSnd]=React.useState(false);
    return (
      <div>
        <div className="lbl">knobs — drag vertically / wheel (cassette deck)</div>
        <div className="row">
          <Knob label="memory" defaultValue={0.7}/>
          <Knob label="grit" accent="var(--magenta)" min={0} max={11} defaultValue={11}/>
          <Knob label="vibes" accent="var(--green)" defaultValue={0.85}/>
          <Knob label="agency" defaultValue={1}/>
        </div>
        <div className="lbl">switches — hard rocker</div>
        <div className="row">
          <Switch label="sound" checked={snd} onChange={setSnd}/>
          <Switch label="local mode" defaultChecked accent="var(--green)"/>
          <Switch label="phone home" disabled/>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
