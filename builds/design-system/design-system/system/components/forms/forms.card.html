<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); padding:24px 26px; font-family:var(--font-mono); }
  .lbl { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:0 0 12px; }
  .row { display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin-bottom:22px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Tabs, Checkbox, Radio, Select, Avatar, Tooltip, SlapButton } = window.SandboxOSDesignSystem_4526c4;
  function Demo(){
    const [tab,setTab]=React.useState(0);
    const [r,setR]=React.useState('local');
    return (
      <div>
        <Tabs tabs={["STAT","INV","DATA","MAP","RADIO"]} value={tab} onChange={setTab}/>
        <div className="lbl" style={{marginTop:16}}>checkbox · radio · select</div>
        <div className="row">
          <Checkbox defaultChecked label="remember this device"/>
          <Checkbox label="phone home"/>
          <Radio name="loc" checked={r==='local'} value="local" onChange={setR} label="on this machine"/>
          <Radio name="loc" checked={r==='cloud'} value="cloud" onChange={setR} label="in the cloud"/>
          <Select label="mode" options={["sovereign","workbench","night shift"]}/>
        </div>
        <div className="lbl">avatar (the rebel) · tooltip</div>
        <div className="row">
          <Avatar face="⌐■_■" status="online" serial="982-V7"/>
          <Avatar face="¬‿¬" status="building"/>
          <Avatar initials="SBX" status="rebel"/>
          <Tooltip label="nobody's tool"><SlapButton size="sm">hover me</SlapButton></Tooltip>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
