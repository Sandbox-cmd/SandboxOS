<!-- @dsCard group="Website" viewport="1280x860" name="Website — Pricing (packs)" subtitle="Pricing as cartridge packs: free / plus / super, 3D modules + slap CTAs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SandboxOS — Packs</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:var(--crt-950);color:var(--text);font-family:var(--font-mono);}
  .page{max-width:1180px;margin:0 auto;padding:0 28px 80px;}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:2px solid var(--signal);}
  .wm{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:20px;text-transform:uppercase;} .wm b{color:var(--magenta);} .wm .g{font-family:var(--font-crt);font-size:24px;}
  nav .lk{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ash-300);}
  .hd{text-align:center;padding:48px 0 10px;}
  .hd h1{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,5vw,58px);text-transform:uppercase;letter-spacing:-.02em;margin:0;}
  .hd p{color:var(--ash-300);font-size:14px;margin-top:10px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;align-items:start;}
  .tier{border:2px solid var(--crt-700);background:rgba(10,10,8,.82);padding:0 0 20px;}
  .tier.feat{border-color:var(--magenta);}
  .tier .top{display:flex;justify-content:center;padding:22px 0 6px;}
  .tier .nm{text-align:center;font-family:var(--font-display);font-weight:900;font-size:20px;text-transform:uppercase;}
  .tier .pr{text-align:center;font-family:var(--font-poster);font-size:44px;color:var(--amber);line-height:.9;margin:6px 0;}
  .tier .pr small{font-family:var(--font-mono);font-size:11px;color:var(--ash-400);}
  .tier ul{list-style:none;margin:14px 22px;padding:0;font-size:12.5px;line-height:1.4;}
  .tier li{padding:7px 0;border-bottom:1px dashed var(--crt-700);color:var(--text-dim);}
  .tier li::before{content:"▸ ";color:var(--green);}
  .tier .cta{text-align:center;margin-top:16px;}
  .badge{display:block;text-align:center;font-family:var(--font-display);font-weight:900;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--magenta);padding:5px;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="page">
  <nav><div class="wm"><span class="g">▚</span> SANDBOX<b>OS</b></div><div class="lk">packs · unlicensed · © nobody</div></nav>
  <div class="hd"><h1>Pick your pack</h1><p>cartridges are free to build &amp; fork. packs just give you more shelf.</p></div>
  <div id="root"></div>
</div>
<script type="text/babel">
  const { Cartridge, SlapButton, Sticker } = window.SandboxOSDesignSystem_4526c4;
  function Tier({ kind, nm, price, per, feats, featured, cta, ctatone }){
    return (
      <div className={"tier"+(featured?" feat":"")}>
        {featured && <span className="badge">★ most builds shipped ★</span>}
        <div className="top"><Cartridge title={nm} subtitle={"pack · "+kind} kind={kind} width={120} spin={featured}/></div>
        <div className="nm">{nm}</div>
        <div className="pr">{price}<br/><small>{per}</small></div>
        <ul>{feats.map((f,i)=><li key={i}>{f}</li>)}</ul>
        <div className="cta"><SlapButton tone={ctatone} size="md">{cta}</SlapButton></div>
      </div>
    );
  }
  function Demo(){
    return (
      <div className="grid">
        <Tier kind="build" nm="Free" price="$0" per="forever · local" cta="↓ build it" ctatone="default"
          feats={["1 cartridge slot","runs local · all yours","keeps the bugs you beat","talks back"]}/>
        <Tier kind="skill" nm="Plus" price="$0" per="still nobody's tool" featured cta="↓ get plus" ctatone="go"
          feats={["unlimited cartridges","the 3D shelf","fork & share builds","priority weirdness"]}/>
        <Tier kind="persona" nm="Super" price="$0" per="open · MIT" cta="⑂ fork it" ctatone="rebel"
          feats={["everything in plus","persona cartridges","the character, unlocked","run your own gateway"]}/>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
