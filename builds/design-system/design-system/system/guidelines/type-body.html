<!-- @dsCard group="Type" viewport="700x320" name="Body & Label Scale" subtitle="Archivo for prose; lowercase, calm machine voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); padding: 24px 28px; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--crt-800); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
         width: 92px; flex: none; text-transform: uppercase; letter-spacing: var(--ls-wide); }
  .s { font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="line"><span class="tag">2xl · 800</span><span class="s" style="font-size:34px;font-weight:800;letter-spacing:-.02em">a machine that's yours</span></div>
  <div class="line"><span class="tag">xl · 700</span><span class="s" style="font-size:27px;font-weight:700">it remembers what matters</span></div>
  <div class="line"><span class="tag">lg · 600</span><span class="s" style="font-size:21px;font-weight:600">heckles your worst ideas</span></div>
  <div class="line"><span class="tag">base · 400</span><span class="s" style="font-size:15px">keeps what it learned, expands through cartridges — a partner for builders who want agency, not assistance.</span></div>
  <div class="line" style="border:0"><span class="tag">label · mono</span><span class="sbx-label" style="color:var(--text-dim)">SYSTEM · LOCAL · ALL YOURS</span></div>
</body>
</html>
