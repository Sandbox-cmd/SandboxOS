<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); padding: 26px 28px; }
  .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
          text-transform: uppercase; letter-spacing: var(--ls-wide); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div class="meta">Archivo · 900 · display</div>
      <div class="sbx-slap" style="font-size: 58px; color: var(--amber); text-shadow: var(--glow-md); line-height: .9;">NOBODY'S TOOL</div>
    </div>
    <div class="row">
      <div>
        <div class="meta">Anton · poster slap</div>
        <div class="sbx-poster" style="font-size: 46px; color: var(--signal);">RUN IT<br>YOURSELF</div>
      </div>
      <div style="margin-left:auto; text-align:right;">
        <div class="meta">condensed numerals</div>
        <div class="sbx-poster" style="font-size: 56px; color: var(--magenta);">001<span style="color:var(--text-faint)">/</span>002</div>
      </div>
    </div>
  </div>
</body>
</html>
