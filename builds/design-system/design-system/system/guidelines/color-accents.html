<!-- @dsCard group="Colors" viewport="700x190" name="Earned Color — Phosphor + Slap" subtitle="Accents that earn their place; supercolor = cartridge only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);padding:22px 24px;font-family:var(--font-mono);}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .sw{width:92px;height:54px;border:2px solid var(--ink);display:flex;align-items:flex-end;padding:5px;font-size:9px;letter-spacing:.03em;}
  .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:0 0 10px;}
  .super{height:22px;margin-top:12px;border:2px solid var(--ink);background:var(--supercolor);}
</style></head>
<body>
  <div class="lbl">phosphor accents — broadcast register</div>
  <div class="row">
    <div class="sw" style="background:var(--amber);color:var(--ink)">amber · active</div>
    <div class="sw" style="background:var(--green);color:var(--ink)">green · ok</div>
    <div class="sw" style="background:var(--cyan);color:var(--ink)">cyan · link</div>
    <div class="sw" style="background:var(--blue);color:var(--signal)">blue · error</div>
    <div class="sw" style="background:var(--magenta);color:var(--signal)">magenta · her</div>
  </div>
  <div class="lbl" style="margin-top:14px">slap loud · then supercolor (cartridge only)</div>
  <div class="row">
    <div class="sw" style="background:var(--hazard);color:var(--ink)">hazard</div>
    <div class="sw" style="background:var(--alert);color:var(--signal)">alert</div>
    <div class="sw" style="background:var(--purple);color:var(--signal)">astral</div>
  </div>
  <div class="super"></div>
</body></html>
