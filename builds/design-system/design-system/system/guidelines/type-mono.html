<!-- @dsCard group="Type" viewport="700x230" name="Mono · CRT · Pixel" subtitle="JetBrains Mono (data/serials), VT323 (teletext), Silkscreen (labels)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);padding:22px 24px;}
  .line{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--crt-800);}
  .tag{font-family:var(--font-mono);font-size:9px;width:96px;flex:none;color:var(--text-faint);text-transform:uppercase;letter-spacing:.1em;}
</style></head>
<body>
  <div class="line"><span class="tag">mono · data</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--text)">build 982-V7 · rate 0.0001 · 001/500</span></div>
  <div class="line"><span class="tag">crt · teletext</span><span style="font-family:var(--font-crt);font-size:30px;color:var(--amber);text-shadow:0 0 8px var(--glow-amber);letter-spacing:.06em">THANK YOU FOR USING</span></div>
  <div class="line"><span class="tag">crt · boot</span><span style="font-family:var(--font-crt);font-size:21px;color:var(--green)">&gt; warming up the workbench…_</span></div>
  <div class="line" style="border:0"><span class="tag">pixel · label</span><span style="font-family:var(--font-pixel);font-size:13px;color:var(--cyan);text-transform:uppercase">NOBODYS TOOL</span></div>
</body></html>
