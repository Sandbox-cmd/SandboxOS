<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing · Radii · Shadows" subtitle="4px base · hard 0px corners · hard offset shadows" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);padding:22px 24px;font-family:var(--font-mono);}
  .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:0 0 9px;}
  .sp{display:flex;gap:10px;align-items:flex-end;}
  .sp i{background:var(--amber);display:block;}
  .sp span{font-size:8px;color:var(--text-faint);}
  .sp div{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .row{display:flex;gap:18px;align-items:center;margin-top:18px;flex-wrap:wrap;}
  .box{width:54px;height:40px;background:var(--surface-2);border:2px solid var(--signal);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text-faint);}
</style></head>
<body>
  <div class="lbl">spacing — 4px base unit</div>
  <div class="sp">
    <div><i style="width:4px;height:4px"></i><span>1</span></div>
    <div><i style="width:8px;height:8px"></i><span>2</span></div>
    <div><i style="width:12px;height:12px"></i><span>3</span></div>
    <div><i style="width:16px;height:16px"></i><span>4</span></div>
    <div><i style="width:24px;height:24px"></i><span>6</span></div>
    <div><i style="width:32px;height:32px"></i><span>8</span></div>
    <div><i style="width:48px;height:48px"></i><span>12</span></div>
  </div>
  <div class="lbl" style="margin-top:18px">radii (mostly 0) · borders · shadows</div>
  <div class="row">
    <div class="box" style="border-radius:0">r-0</div>
    <div class="box" style="border-radius:4px">r-2</div>
    <div class="box" style="border-radius:999px;width:64px">pill</div>
    <div class="box" style="box-shadow:3px 3px 0 var(--ink);border-radius:0">slap</div>
    <div class="box" style="box-shadow:0 0 0 3px var(--signal),3px 4px 0 rgba(0,0,0,.5);background:var(--magenta)">halo</div>
    <div class="box" style="box-shadow:0 0 14px var(--glow-amber);color:var(--amber);border-color:var(--amber)">glow</div>
  </div>
</body></html>
